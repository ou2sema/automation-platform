<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop - Sign in</title>
  </head>
  <body data-route="sign-in">
    <main data-testid="shop-page" data-route="sign-in">
      <h1>Sign in</h1>
      <p data-testid="notice" hidden></p>
      <p data-testid="auth-error" role="alert" hidden></p>
      <form data-testid="sign-in-form">
        <label>
          Account
          <input data-testid="username" name="username" type="text" autocomplete="off" />
        </label>
        <label>
          Password
          <input data-testid="password" name="password" type="password" autocomplete="off" />
        </label>
        <button data-testid="sign-in-submit" type="submit">Sign in</button>
      </form>
      <p>Signed in as <span data-testid="session-user" hidden>guest</span></p>
    </main>
    <script src="./shop.js"></script>
  </body>
</html>
