<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop - Order confirmation</title>
  </head>
  <body data-route="order-confirmation">
    <main data-testid="shop-page" data-route="order-confirmation">
      <h1>Order confirmed</h1>
      <p data-testid="order-reference"></p>
      <p>Paid <span data-testid="order-total">$0.00</span></p>
      <p><span data-testid="order-count">0</span> item(s) in this order</p>
      <p>Orders placed in this session: <span data-testid="placed-count">0</span></p>
      <a data-testid="back-to-catalogue" href="catalogue.html">Back to catalogue</a>
    </main>
    <script src="./shop.js"></script>
  </body>
</html>
